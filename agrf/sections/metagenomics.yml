id: metagenomics
title: Metagenomics

tabs:
  - id: overview
    title: Overview
    content:

        - title_md: About the service
          description_md: |
            Illumina metagenomic whole genome sequencing (MetaWGS) is used to characterise microbial communities by sequencing DNA directly from environmental or biological samples.

            Sequencing is performed using paired-end reads (150 bp) on an Illumina NovaSeq platform. Raw sequencing data undergoes quality control and filtering to remove adapter sequences and low-quality bases.

            The processed reads are analysed to determine the taxonomic composition and functional potential of the microbial community. Taxonomic profiling is performed using Kraken2 and Bracken, enabling classification of reads across different taxonomic levels. Functional profiling is performed using HUMAnN2, providing insights into gene families and metabolic pathways present in the samples.

            The final outputs include read count summaries, taxonomic classifications, functional profiling results, and interactive visualisations, allowing comprehensive analysis of microbial community structure and function.

        - title_md: Sequencing Output
          description_md: |
            **Read length:** 150 bp paired-end reads  

            **Number of reads:** Varies per sample  

            Raw sequencing reads are provided as FASTQ files containing sequence and quality score information.

        - title_md: What files are included?
          description_md: |

            | Filename | Description |
            |----------|------------|
            | readCountsTable.tsv | Read counts for each sample across processing steps (raw, trimmed, classified) |
            | taxonomic_profiling/{sample_name}/{sample_name}.kraken.report | Taxonomic classification results from Kraken2 |
            | taxonomic_profiling/{sample_name}/{sample_name}.bracken.tsv | Refined taxonomic abundance estimates from Bracken |
            | taxonomic_profiling/{sample_name}/{sample_name}.html | Interactive Krona plot for taxonomic composition |
            | taxonomic_profiling/absolute_abundance.xlsx | Absolute abundance of taxa across samples |
            | taxonomic_profiling/relative_abundance.xlsx | Relative abundance of taxa across samples |
            | taxonomic_profiling/barplot/index.html | Interactive barplot visualisation of taxonomic composition |
            | functional_profiling/{sample_name}_genefamilies.tsv | Gene family abundance per sample |
            | functional_profiling/{sample_name}_pathabundance.tsv | Pathway abundance per sample |
            | functional_profiling/{sample_name}_pathcoverage.tsv | Pathway coverage per sample |
            | functional_profiling/humann2_genefamilies.tsv | Gene family count matrix across samples |
            | functional_profiling/humann2_pathabundance.tsv | Pathway abundance matrix across samples |
            | functional_profiling/humann2_pathcoverage.tsv | Pathway coverage matrix across samples |

        - title_md: File formats used
          description_md: |

            | Type | Description |
            |------|------------|
            | .fastq / .fastq.gz | Raw sequencing reads |
            | .tsv | Tab-separated files for read counts, taxonomy, and functional profiles |
            | .xlsx | Excel files for abundance tables |
            | .html | Interactive visualisations (Krona plots, barplots) |

  - id: tools
    title: Tools
    content:
      subsections:

        - id: assembly
          title: Assembly
          content:
            - title_md: <code>MEGAHIT</code> - Assemble short-reads into contigs
              description_md: |
                Assemble short reads into contigs for metagenomic analysis.
              inputs:
                - label: Sequencing reads (FASTQ)
                  datatypes:
                    - fastqsanger
              outputs:
                - label: Assembled contigs (FASTA)
              button_md: Run MEGAHIT
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fmegahit%2Fmegahit"

            - title_md: <code>metaSPAdes / meta-hifiasm</code> - Assemble long-reads or hybrid reads
              description_md: |
                Assemble long-read or hybrid metagenomic data (e.g., PacBio).
              inputs:
                - label: Long reads (FASTQ)
                  datatypes:
                    - fastqsanger
              outputs:
                - label: Assembled contigs (FASTA)
              button_md: Run metaSPAdes
              button_link:  "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fnml%2Fmetaspades%2Fmetaspades"

        - id: assembly_qc
          title: Assembly quality control
          content:
            - title_md: <code>QUAST</code> - Assess assembly quality
              description_md: |
                Assess the quality of assembled contigs, including length, completeness and fragmentation.
              inputs:
                - label: Assembled contigs (FASTA)
                  datatypes:
                    - fasta
              outputs:
                - label: Assembly quality report
              button_md: Run QUAST
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fquast%2Fquast"

        - id: taxonomicprofiling
          title: Taxonomic profiling
          content:

            - title_md: <code>Kraken2</code> - Taxonomic classification
              description_md: |
                Classify metagenomic reads against reference databases to identify microbial taxa present in the samples.
              inputs:
                - label: FASTQ reads for metagenomic classification
                  datatypes:
                    - fastqsanger
              outputs:
                - label: Taxonomic classification reports
              button_md: Run Kraken2
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fkraken2%2Fkraken2"     
          
        - id: binning
          title: Binning
          content:
            - title_md: <code>MetaBAT2</code> - Bin contigs into genomes
              description_md: |
                Group assembled contigs into genome bins representing individual microbial genomes.
              inputs:
                - label: Assembled contigs (FASTA)
                  datatypes:
                    - fasta
                - label: BAM files generated by mapping reads back to assembled contigs
                  datatypes:
                    - bam
              outputs:
                - label: Genome bins (FASTA)
              button_md: Run MetaBAT2
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fmetabat2%2Fmetabat2"
        
        - id: binning_qc
          title: Binning quality control
          content:
            - title_md: <code>CheckM2</code> - Assess completeness and contamination
              description_md: |
                Assess genome bin quality by estimating completeness and contamination.

              inputs:
                - label: Genome bins (FASTA)
                  datatypes:
                    - fasta
              outputs:
                - label: Completeness and contamination report
              button_md: Run CheckM2
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fcheckm2%2Fcheckm2"
          

        - id: taxonomy
          title: Taxonomic classification
          content:
            - title_md: <code>GTDB-Tk</code> - Assign taxonomy to genome bins
              description_md: |
                Assign taxonomy to genome bins using the Genome Taxonomy Database.
              inputs:
                - label: Genome bins
                  datatypes:
                    - fasta
              outputs:
                - label: Taxonomic classification (TSV)
              button_md: Run GTDB-Tk
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fgtdbtk_classify_wf%2Fgtdbtk_classify_wf"
              
        - id: functional_annotation
          title: Functional annotation
          content:
            - title_md: <code>Bakta</code> - Functional annotation of genomes
              description_md: |
                Annotate assembled genomes and bins to identify genes and functional features.
                This helps in understanding the biological roles of microbial communities.
              inputs:
                - label: Genome bins or contigs (FASTA)
                  datatypes:
                    - fasta
              outputs:
                - label: Annotated genomes and functional features
              button_md: Run Bakta
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fbakta%2Fbakta%2F1.9.4%2Bgalaxy1&version=latest"
  - id: tutorials           
    title: Tutorials
    content:
      - title_md: Metagenomics analysis tutorials
        description_md: Learn how to perform metagenomic analysis in Galaxy, including taxonomic classification, assembly, binning, and downstream functional analysis workflows.
        button_md: Tutorials
        button_link: https://training.galaxyproject.org/training-material/topics/metagenomics/