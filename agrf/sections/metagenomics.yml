id: metagenomics
title: Metagenomics

tabs:
  - id: overview
    title: Overview
    content:
      - title_md: About the service
        description_md: |
          Metagenomics analysis enables the study of microbial communities directly from environmental or host-associated samples without the need for culturing. 
          This workflow processes sequencing reads through assembly, quality assessment, genome binning, and taxonomic and functional annotation.

          Short-read assemblies are generated using MEGAHIT, while long-read assemblies are performed using meta-hifiasm. 
          Assembly quality is evaluated using QUAST, and genome binning is carried out using MetaBAT to reconstruct individual microbial genomes.

          Bin quality is assessed using CheckM2, which estimates genome completeness and contamination. 
          Taxonomic classification is performed using GTDB-Tk, and functional annotation is conducted using Bakta to identify genes and biological functions.

          This pipeline provides insights into microbial diversity, genome composition, and functional potential of complex microbial communities.

      - title_md: Results include
        description_md: |
          Metagenomics analysis generates multiple output files across different stages of the workflow.

          **Processed read data**
          - Quality filtered sequencing reads (FASTQ files)

          **Assembly outputs**
          - Contigs or assembled genomes representing microbial sequences

          **Assembly quality assessment**
          - QUAST reports summarising assembly statistics (e.g., N50, contig length, total assembly size)

          **Genome binning**
          - Genome bins representing reconstructed microbial genomes

          **Binning quality assessment**
          - CheckM2 reports indicating completeness and contamination levels of genome bins

          **Taxonomic classification**
          - GTDB-Tk results assigning taxonomy to genome bins

          **Functional annotation**
          - Bakta outputs including gene predictions and functional annotations

          **Summary outputs**
          - Tables and reports for downstream analysis and interpretation

      - title_md: What files are included?
        description_md: |
          | **Filename** | **Description** |
          |-------------|----------------|
          | Demultiplexed *.FASTQ files (per sample) | Raw sequencing reads for each sample |
          | contigs.fasta | Assembled contigs generated from sequencing reads |
          | quast_report.html | Assembly quality report including N50, contig length, and summary statistics |
          | bins/*.fa | Genome bins representing reconstructed microbial genomes |
          | checkm2_results.tsv | Genome bin quality metrics (completeness and contamination) |
          | gtdbtk_classification.tsv | Taxonomic classification of genome bins using GTDB-Tk |
          | bakta_annotations.tsv | Functional annotations including gene predictions and protein functions |
          | summary_tables.tsv | Summary tables for downstream analysis and interpretation |

      - title_md: File formats used
        description_md: |
          | **Type** | **Description** |
          |---------|----------------|
          | .fastq | Raw sequencing reads |
          | .fasta / .fa | Assembled contigs or genome bins |
          | .tsv | Tabular files containing QC metrics, taxonomy, and annotations |
          | .html | Quality reports (e.g., QUAST) |
          | .gff | Gene annotations and genomic features |

  - id: tools
    title: Tools
    content:
      subsections:

        - id: assembly
          title: Assembly
          content:
            - title_md: <code>MEGAHIT</code> - Assemble short-reads into contigs
              description_md: |
                Assemble short reads into contigs for metagenomic analysis.
              inputs:
                - label: Sequencing reads (FASTQ)
                  datatypes:
                    - fastq
              outputs:
                - label: Assembled contigs (FASTA)
              button_md: Run MEGAHIT
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fmegahit%2Fmegahit"

            - title_md: <code>metaSPAdes / meta-hifiasm</code> - Assemble long-reads or hybrid reads
              description_md: |
                Assemble long-read or hybrid metagenomic data (e.g., PacBio).
              inputs:
                - label: Long reads (FASTQ)
                  datatypes:
                    - fastq
              
        - id: assembly_qc
          title: Assembly quality control
          content:
            - title_md: <code>QUAST</code> - Assess assembly quality
              description_md: |
                Assess the quality of assembled contigs, including length, completeness and fragmentation.
              inputs:
                - label: Assembled contigs (FASTA)
                  datatypes:
                    - fasta
              outputs:
                - label: Assembly quality report
              button_md: Run QUAST
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fquast%2Fquast"
          
        - id: binning
          title: Binning
          content:
            - title_md: <code>MetaBAT2</code> - Bin contigs into genomes
              description_md: |
                Group assembled contigs into genome bins representing individual microbial genomes.
              inputs:
                - label: Assembled contigs (FASTA)
                  datatypes:
                    - fasta
                - label: BAM files (mapped reads)
                  datatypes:
                    - bam
              outputs:
                - label: Genome bins (FASTA)
              button_md: Run MetaBAT2
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fmetabat2%2Fmetabat2"
        
        - id: binning_qc
          title: Binning quality control
          content:
            - title_md: <code>CheckM2</code> - Assess completeness and contamination
              description_md: |
                Assess genome bin quality by estimating completeness and contamination.

              inputs:
                - label: Genome bins (FASTA)
                  datatypes:
                    - fasta
              outputs:
                - label: Completeness and contamination report
              button_md: Run CheckM2
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fcheckm2%2Fcheckm2"
          

        - id: taxonomy
          title: Taxonomic classification
          content:
            - title_md: <code>GTDB-Tk</code> - Assign taxonomy to genome bins
              description_md: |
                Assign taxonomy to genome bins using the Genome Taxonomy Database.
              inputs:
                - label: Genome bins
                  datatypes:
                    - fasta
              outputs:
                - label: Taxonomic classification (TSV)
              button_md: Run GTDB-Tk
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fgtdbtk_classify_wf%2Fgtdbtk_classify_wf"
              
        - id: functional_annotation
          title: Functional annotation
          content:
            - title_md: <code>Bakta</code> - Functional annotation of genomes
              description_md: |
                Annotate assembled genomes and bins to identify genes and functional features.
                This helps in understanding the biological roles of microbial communities.
              inputs:
                - label: Genome bins or contigs (FASTA)
                  datatypes:
                    - fasta
              outputs:
                - label: Annotated genomes and functional features
              button_md: Run Bakta
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fbakta%2Fbakta%2F1.9.4%2Bgalaxy1&version=latest"
  - id: tutorials           
    title: Tutorials
    content:
      - title_md: Metagenomics analysis tutorials
        description_md: Learn how to perform metagenomic analysis in Galaxy, including taxonomic classification, assembly, binning, and downstream functional analysis workflows.
        button_md: Tutorials
        button_link: https://training.galaxyproject.org/training-material/topics/metagenomics/