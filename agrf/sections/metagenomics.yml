id: metagenomics
title: Metagenomics

tabs:
  - id: overview
    title: Overview
    content:
      - title_md: Metagenomics workflow
        description_md: |
          Metagenomics analysis involves assembly, binning, taxonomic classification,
          and functional annotation of microbial communities.

  - id: tools
    title: Tools
    content:
      subsections:

        - id: assembly
          title: Assembly
          content:
            - title_md: <code>MEGAHIT</code>
              description_md: |
                Assemble short reads into contigs for metagenomic analysis.

            - title_md: <code>metaSPAdes / meta-hifiasm</code>
              description_md: |
                Assemble long-read or hybrid metagenomic data.