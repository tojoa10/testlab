id: rnaseq
title: RNASeq
tabs:
  - id: overview
    title: Overview
    heading_md: 
    content:
      - title_md: RNASeq workflow
        description_md: |
          RNA sequencing (RNASeq) measures gene expression levels across samples.
          The workflow includes alignment, filtering, normalization,
          differential expression analysis and visualization.

  - id: tools
    title: Tools
    content:
      subsections:
 
        - id: qc
          title: Quality control
          content:
            - title_md: <code>FastQC</code>
              description_md: |
                Assess raw RNASeq read quality including base quality scores, GC content and adapter contamination.
              inputs:
                - label: Sequencing reads (FASTQ)
                  datatypes:
                    - fastq
              button_md: Run FastQC
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fdevteam%2Ffastqc%2Ffastqc"

            - title_md: <code>MultiQC</code>
              description_md: |
                Aggregate QC reports across multiple samples into a single summary report.
              inputs:
                - label: FastQC reports
                  datatypes:
                    - html
                    - zip
              outputs:
                - label: Summary QC report (HTML)
              button_md: Run MultiQC
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fmultiqc%2Fmultiqc"

            - title_md: <code>Trim Galore</code> - Trim adapters and low-quality bases
              description_md: |
                Remove adapter sequences and low-quality bases from RNASeq reads before alignment.
              inputs:
                - label: Sequencing reads (FASTQ)
                  datatypes:
                    - fastq
              outputs:
                - label: Trimmed reads (FASTQ)
              button_md: Run Trim Galore
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fbgruening%2Ftrim_galore%2Ftrim_galore"

            - title_md: <code>sortmerna</code>
              description_md: |
                Remove rRNA reads from RNASeq data.
              inputs:
                - label: Sequencing reads (FASTQ)
                  datatypes:
                    - fastq
              outputs:
                - label: Filtered reads (FASTQ)
              button_md: Run sortmerna
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Frnateam%2Fsortmerna%2Fbg_sortmerna"


        - id: alignment
          title: Alignment
          content:
            - title_md: <code>STAR</code> - Align reads to reference
              description_md: |
                Align RNASeq reads to a reference genome using STAR.

              inputs:
                - label: RNASeq reads (FASTQ)
                  datatypes:
                    - fastq
                - label: Reference genome (fasta)
                  datatypes:
                    - fasta
                - label: Gene annotation file (GTF)
                  datatypes:
                    - gtf
              outputs:
                - label: Aligned reads (BAM)
              button_md: Run STAR
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Frgrnastar%2Frna_star"

        - id: post_alignment
          title: BAM processing
          content:
            - title_md: <code>samtools sort</code>
              description_md: |
                Sort aligned reads (BAM) by genomic coordinates.

              inputs:
                - label: Aligned reads (BAM)
                  datatypes:
                    - bam
              outputs:
                - label: Sorted BAM 
              button_md: Run samtools sort
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fdevteam%2Fsamtools_sort%2Fsamtools_sort"
 
        - id: quantification
          title: Gene quantification
          content:
            - title_md: <code>featureCounts</code> - Count reads per gene
              description_md: |
                Convert aligned reads (BAM files) into a gene count matrix required for downstream differential expression analysis.

              inputs:
                - label: Aligned reads (BAM)
                  datatypes:
                    - bam
                - label: Gene annotation file
                  datatypes:
                    - gtf
                    - gff
              outputs:
                - label: Gene count matrix (TSV)
              button_md: Run featureCounts  
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Ffeaturecounts%2Ffeaturecounts"

            - title_md: <code>StringTie</code>
              description_md: |
                Assemble transcripts and estimate gene expression from aligned RNASeq reads.
              inputs:
                - label: Aligned reads (BAM)
                  datatypes:
                    - bam
                - label: Reference annotation (GTF)
                  datatypes:
                    - gtf
              outputs:
                - label: Transcript assembly (GTF)
              button_md: Run StringTie
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fstringtie%2Fstringtie"

        - id: filtering
          title: Filtering
          content:
            - title_md: Sample filtering
              description_md: |
                Remove outlier samples or unwanted groups before analysis.
            - title_md: Filter lowly expressed genes
              description_md: |
                Remove genes with low counts across samples to improve statistical power in differential expression analysis.

        - id: normalization
          title: Normalization
          content:
            - title_md: Normalization
              description_md: |
                Adjusts for differences in sequencing depth and library size between samples to allow accurate comparison of gene expression.
                
        - id: analysis
          title: Differential expression
          content:
            - title_md: <code>edgeR</code>
              description_md: |
                Differential gene expression analysis.
              inputs:
                - label: Gene count matrix
                  datatypes:
                    - tsv
                - label: Sample metadata
                  datatypes:
                    - tsv
              outputs:
                - label: Differential expression results (TSV)
              button_md: Run edgeR
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fedger%2Fedger"

            - title_md: <code>DESeq2</code>
              description_md: |
                Identify differentially expressed genes between groups.
              inputs:
                - label: Gene count matrix
                  datatypes:
                    - tsv
                - label: Sample metadata
                  datatypes:
                    - tsv
              outputs:
                - label: Differential expression results (TSV)
              button_md: Run DESeq2
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fdeseq2%2Fdeseq2"

        - id: visualisation
          title: Visualisation
          content:
            - title_md: PCA
              description_md: |
                Explore sample clustering using principal component analysis.
              
            - title_md: Heatmap
              description_md: |
                Display gene expression patterns across samples.
              inputs:
                - label: Expression matrix 
                  datatypes:
                    - tsv
              button_md: Run Heatmap
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fggplot2_heatmap2%2Fggplot2_heatmap2"

            - title_md: Volcano plot
              description_md: |
                Visualise differential expression results (log fold change vs significance).
              inputs:
                - label: Differential expression results (TSV)
                  datatypes:
                    - tsv
              button_md: Run Volcano plot
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fvolcanoplot%2Fvolcanoplot"


  - id: tutorials
    title: Tutorials
    heading_md:
    content:
      - title_md: RNA-seq analysis workflow tutorial
        description_md: tool
        button_md: Tutorials
        button_link:  https://training.galaxyproject.org/training-material/topics/transcriptomics/