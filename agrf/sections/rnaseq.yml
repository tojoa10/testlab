id: rnaseq
title: RNASeq
tabs:
  - id: overview
    title: Overview
    heading_md: 
    content:
      - title_md: RNASeq workflow
        description_md: |
          RNA sequencing (RNASeq) measures gene expression levels across samples.
          The workflow includes alignment, filtering, normalization,
          differential expression analysis and visualization.

  - id: tools
    title: Tools
    content:
      subsections:
 
        - id: qc
          title: Quality control
          content:
            - title_md: <code>FastQC</code>
              description_md: |
                Assess raw RNASeq read quality including base quality scores, GC content and adapter contamination.

            - title_md: <code>MultiQC</code>
              description_md: |
                Aggregate QC reports across multiple samples into a single summary report.
        
        - id: alignment
          title: Alignment
          content:
            - title_md: <code>STAR</code> - Align reads to reference
              description_md: |
                Align RNASeq reads to a reference genome using STAR.
              button_md: Run STAR
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Frgrnastar%2Frna_star"
 
        - id: quantification
          title: Gene quantification
          content:
            - title_md: <code>featureCounts</code> - Count reads per gene
              description_md: |
                Convert aligned reads (BAM files) into a gene count matrix required for downstream differential expression analysis.

              inputs:
                - label: Aligned reads (BAM)
                  datatypes:
                    - bam
                - label: Gene annotation file
                  datatypes:
                    - gtf
                    - gff
              button_md: Run featureCounts  
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Ffeaturecounts%2Ffeaturecounts"

        - id: filtering
          title: Filtering
          content:
            - title_md: Sample filtering
              description_md: |
                Remove outlier samples or unwanted groups before analysis.
            - title_md: <code>Filter lowly expressed genes</code>
              description_md: |
                Remove genes with low counts across samples to improve statistical power in differential expression analysis.
                
        - id: analysis
          title: Differential expression
          content:
            - title_md: <code>edgeR</code>
              description_md: |
                Differential gene expression analysis.

            - title_md: <code>DESeq2</code>
              description_md: |
                Identify differentially expressed genes between groups.

        - id: visualisation
          title: Visualisation
          content:
            - title_md: PCA
              description_md: |
                Explore sample clustering.

            - title_md: Heatmap
              description_md: |
                Display gene expression patterns.

            - title_md: Volcano plot
              description_md: |
                Visualise differential expression results.