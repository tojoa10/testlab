id: rnaseq
title: RNASeq
tabs:
  - id: overview
    title: Overview
    content:
      - title_md: About the service
        description_md: |
          RNA sequencing (RNASeq) is used to quantify gene expression and identify differentially expressed genes across biological conditions. In this workflow, raw sequencing reads are quality checked, filtered, and aligned to a reference genome using STAR. Gene-level quantification is performed using featureCounts or StringTie, followed by statistical analysis using edgeR or DESeq2.

          This pipeline enables identification of transcriptional changes, biological pathway alterations, and potential biomarkers associated with experimental conditions.

      - title_md: Results include
        description_md: |
          RNASeq analysis generates multiple output files at different stages of the workflow.

          **Processed read data**
          - Quality filtered FASTQ files (optional after trimming)

          **Alignment outputs**
          - BAM files containing aligned reads
          - Sorted and indexed BAM files

          **Quantification outputs**
          - Gene-level count matrix (tabular format)
          - Transcript abundance estimates (StringTie output)

          **Differential expression results**
          - Tables of differentially expressed genes (log fold change, p-values, adjusted p-values)

          **Visualisation outputs**
          - PCA plots (sample clustering)
          - Heatmaps (expression patterns)
          - Volcano plots (significance vs fold change)

      - title_md: What files are included?
        description_md: |
          **Raw Data**
          - Demultiplexed FASTQ files (per sample) containing sequencing reads

          **Quality Control**
          - FastQC reports (HTML) providing per-sample quality metrics
          - MultiQC summary report aggregating quality results across all samples

          **Alignment**
          - BAM files containing reads mapped to the reference genome

          **Quantification**
          - Gene count matrix (.tsv or .txt) containing gene-level expression values
          - Transcript abundance files (StringTie output)

          **Differential Expression**
          - DEG results table (.tsv) including log fold change, p-values, and adjusted p-values

          **Visualisation**
          - PCA plots, heatmaps, and volcano plots for downstream interpretation

      - title_md: File formats used
        description_md: |
          **.fastq**
          - Raw sequencing reads

          **.bam**
          - Binary alignment file storing mapped reads

          **.tsv / .txt**
          - Tabular files containing gene counts and statistical results

          **.html**
          - Quality control reports (FastQC, MultiQC)

          **.csv**
          - Processed results and downstream analysis tables (e.g., DEG results)

  - id: tools
    title: Tools
    content:
      subsections:
 
        - id: qc
          title: Quality control
          content:
            - title_md: <code>FastQC</code> - Assess sequencing read quality
              description_md: |
                Assess raw RNASeq read quality including base quality scores, GC content and adapter contamination.
              inputs:
                - label: Sequencing reads (FASTQ)
                  datatypes:
                    - fastq
              outputs:
                - label: FastQC report (HTML)
              button_md: Run FastQC
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fdevteam%2Ffastqc%2Ffastqc"

            - title_md: <code>MultiQC</code> - Aggregate QC reports
              description_md: |
                Aggregate QC reports across multiple samples into a single summary report.
              inputs:
                - label: FastQC reports
                  datatypes:
                    - html
                    - zip
              outputs:
                - label: Summary QC report (HTML)
              button_md: Run MultiQC
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fmultiqc%2Fmultiqc"

            - title_md: <code>Trim Galore</code> - Trim adapters and low-quality bases
              description_md: |
                Remove adapter sequences and low-quality bases from RNASeq reads before alignment.
              inputs:
                - label: Sequencing reads (FASTQ)
                  datatypes:
                    - fastq
              outputs:
                - label: Trimmed reads (FASTQ)
              button_md: Run Trim Galore
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fbgruening%2Ftrim_galore%2Ftrim_galore"

            - title_md: <code>sortmerna</code> - Remove rRNA contamination
              description_md: |
                Remove rRNA reads from RNASeq data.
              inputs:
                - label: Sequencing reads (FASTQ)
                  datatypes:
                    - fastq
              outputs:
                - label: Filtered reads (FASTQ)
              button_md: Run sortmerna
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Frnateam%2Fsortmerna%2Fbg_sortmerna"


        - id: alignment
          title: Alignment
          content:
            - title_md: <code>STAR</code> - Align reads to reference genome
              description_md: |
                Align RNASeq reads to a reference genome using STAR.

              inputs:
                - label: RNASeq reads (FASTQ)
                  datatypes:
                    - fastq
                - label: Reference genome (fasta)
                  datatypes:
                    - fasta
                - label: Gene annotation file (GTF)
                  datatypes:
                    - gtf
              outputs:
                - label: Aligned reads (BAM)
              button_md: Run STAR
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Frgrnastar%2Frna_star"

        - id: post_alignment
          title: BAM processing
          content:
            - title_md: <code>samtools sort</code> - Sort BAM files
              description_md: |
                Sort aligned reads (BAM) by genomic coordinates.

              inputs:
                - label: Aligned reads (BAM)
                  datatypes:
                    - bam
              outputs:
                - label: Sorted BAM 
              button_md: Run samtools sort
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fdevteam%2Fsamtools_sort%2Fsamtools_sort"
 
        - id: quantification
          title: Gene quantification
          content:
            - title_md: <code>featureCounts</code> - Count reads per gene
              description_md: |
                Convert aligned reads (BAM files) into a gene count matrix required for downstream differential expression analysis.

              inputs:
                - label: Aligned reads (BAM)
                  datatypes:
                    - bam
                - label: Gene annotation file
                  datatypes:
                    - gtf
                    - gff
              outputs:
                - label: Gene count matrix (TSV)
              button_md: Run featureCounts  
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Ffeaturecounts%2Ffeaturecounts"

            - title_md: <code>StringTie</code> - Assemble and quantify transcripts
              description_md: |
                Assemble transcripts and estimate gene expression from aligned RNASeq reads.
              inputs:
                - label: Aligned reads (BAM)
                  datatypes:
                    - bam
                - label: Reference annotation (GTF)
                  datatypes:
                    - gtf
              outputs:
                - label: Transcript assembly (GTF)
              button_md: Run StringTie
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fstringtie%2Fstringtie"

        - id: filtering
          title: Filtering
          content:
            - title_md: Sample filtering
              description_md: |
                Remove outlier samples or unwanted groups before analysis.
            - title_md: Filter lowly expressed genes
              description_md: |
                Remove genes with low counts across samples to improve statistical power in differential expression analysis.

        - id: normalization
          title: Normalization
          content:
            - title_md: Normalization
              description_md: |
                Adjusts for differences in sequencing depth and library size between samples to allow accurate comparison of gene expression.
                
        - id: analysis
          title: Differential expression
          content:
            - title_md: <code>edgeR</code> - Differential expression analysis
              description_md: |
                Differential gene expression analysis.
              inputs:
                - label: Gene count matrix
                  datatypes:
                    - tsv
                - label: Sample metadata
                  datatypes:
                    - tsv
              outputs:
                - label: Differential expression results (TSV)
              button_md: Run edgeR
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fedger%2Fedger"

            - title_md: <code>DESeq2</code> - Differential gene expression analysis
              description_md: |
                Identify differentially expressed genes between groups.
              inputs:
                - label: Gene count matrix
                  datatypes:
                    - tsv
                - label: Sample metadata
                  datatypes:
                    - tsv
              outputs:
                - label: Differential expression results (TSV)
              button_md: Run DESeq2
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fdeseq2%2Fdeseq2"

        - id: visualisation
          title: Visualisation
          content:
            - title_md: PCA - Visualise sample clustering
              description_md: |
                Explore sample clustering using principal component analysis.
              
            - title_md: Heatmap - Visualise gene expression patterns
              description_md: |
                Display gene expression patterns across samples.
              inputs:
                - label: Expression matrix 
                  datatypes:
                    - tsv
              button_md: Run Heatmap
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fggplot2_heatmap2%2Fggplot2_heatmap2"

            - title_md: Volcano plot - Visualise differential expression results
              description_md: |
                Visualise differential expression results (log fold change vs significance).
              inputs:
                - label: Differential expression results (TSV)
                  datatypes:
                    - tsv
              button_md: Run Volcano plot
              button_link: "{{ galaxy_base_url }}/?tool_id=toolshed.g2.bx.psu.edu%2Frepos%2Fiuc%2Fvolcanoplot%2Fvolcanoplot"


  - id: tutorials
    title: Tutorials
    heading_md:
    content:
      - title_md: RNA-seq analysis workflow tutorial
        description_md: Learn how to perform RNA-seq analysis in Galaxy, including read preprocessing, alignment, transcript assembly, and differential gene expression analysis.
        button_md: Tutorials
        button_link:  https://training.galaxyproject.org/training-material/topics/transcriptomics/